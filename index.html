<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Art Deco Solar System</title>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://api.fontshare.com/v2/css?f[]=zodiak@300,400,700,900&f[]=bespoke-sans@300,400,500&display=swap');
        
        :root {
            --color-emerald-dark: #04140f;
            --color-emerald-base: #0a2e22;
            --color-gold-light: #fef1c7;
            --color-gold-base: #d4af37;
            --color-gold-dark: #8c7322;
            --font-serif: 'Zodiak', serif;
            --font-sans: 'Bespoke Sans', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-emerald-dark);
            color: var(--color-gold-light);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 0; 
            display: block;
        }

        .radial-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--color-emerald-dark) 100%);
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        .noise-texture {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .deco-frame {
            position: absolute;
            inset: 24px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            pointer-events: none;
            z-index: 3;
        }
        .corner-ornament { position: absolute; width: 32px; height: 32px; }
        .top-left { top: -1px; left: -1px; border-top: 2px solid var(--color-gold-base); border-left: 2px solid var(--color-gold-base); }
        .top-right { top: -1px; right: -1px; border-top: 2px solid var(--color-gold-base); border-right: 2px solid var(--color-gold-base); }
        .bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid var(--color-gold-base); border-left: 2px solid var(--color-gold-base); }
        .bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid var(--color-gold-base); border-right: 2px solid var(--color-gold-base); }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            pointer-events: none; 
            z-index: 10; 
            background: transparent !important;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .middle-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            flex: 1;
            margin: 24px 0;
        }

        .ai-agent-portal-card {
            pointer-events: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 144px;
            height: 240px;
            border-radius: 24px;
            text-decoration: none;
            background: rgba(4, 20, 15, 0.45); 
            border: 2px solid rgba(168, 85, 247, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
        }
        .ai-agent-portal-card:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #f5f3ff;
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
        }

        .shiny-purple-text {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1.4;
            margin-top: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(168, 85, 247, 0.5));
        }

        .bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            width: 100%;
        }
        .btn-about {
            pointer-events: auto;
            border: 1px solid var(--color-gold-base);
            background: rgba(212, 175, 55, 0.2);
            color: var(--color-gold-light);
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-about:hover { background: rgba(212, 175, 55, 0.4); }

        .btn-hamburger {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 36px;
            height: 28px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--color-gold-base);
            padding: 7px;
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .bar { width: 100%; height: 2px; background-color: var(--color-gold-base); }

        #hamburger-panel {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 300px;
            background: rgba(4, 20, 15, 0.96);
            border-right: 1px solid rgba(212, 175, 55, 0.3);
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px;
            gap: 24px;
            box-sizing: border-box;
            z-index: 100;
        }
        .panel-link {
            font-family: var(--font-serif);
            font-size: 24px;
            letter-spacing: 0.1em;
            color: var(--color-gold-light);
            text-decoration: none;
            transition: color 0.3s;
        }
        .panel-link:hover { color: var(--color-gold-base); }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <canvas id="solar-system"></canvas>
        <div class="radial-overlay"></div>
        <div class="noise-texture"></div>
        
        <div class="deco-frame">
            <div class="corner-ornament top-left"></div>
            <div class="corner-ornament top-right"></div>
            <div class="corner-ornament bottom-left"></div>
            <div class="corner-ornament bottom-right"></div>
        </div>

        <div class="ui-layer">
            
            <div class="top-row">
                <div id="hamburger-btn" class="btn-hamburger">
                    <div class="bar"></div>
                    <div class="bar" style="width: 70%;"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="middle-row">
                <a href="next-page.html" class="ai-agent-portal-card">
                    <iconify-icon icon="lucide:cpu" style="font-size: 32px; color: #c084fc;"></iconify-icon>
                    <span class="shiny-purple-text">Ai<br>agent</span>
                </a>
            </div>

            <div class="bottom-row">
                <button class="btn-about">About</button>
            </div>

        </div>

        <div id="hamburger-panel">
            <a href="#" class="panel-link">Home</a>
            <a href="#" class="panel-link">Ai agents</a>
            <a href="#" class="panel-link">About ai agent</a>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('solar-system');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height, centerX, centerY;
        let time = 0;
        let isCollapsing = true;
        let collapseStartTime = null;
        const COLLAPSE_DURATION = 3500;

        const colors = {
            bg: '#04140f',
            core: '#fef1c7',
            coreShadow: '#d4af37',
            orbitLine: 'rgba(212, 175, 55, 0.22)',
            planets: [
                ['#fef1c7', '#d4af37', '#8c7322'],
                ['#6ee7b7', '#10b981', '#047857'],
                ['#fca5a5', '#ef4444', '#b91c1c'],
                ['#e9d5ff', '#a855f7', '#6b21a8'],
                ['#bfdbfe', '#3b82f6', '#1d4ed8'],
                ['#fef08a', '#eab308', '#a16207']
            ]
        };
        const orbitCount = 6;
        const baseTilt = 0.35; // Slightly flatter projection for scale depth
        const planets = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            // SHIFTED: Moves the center of the system to 62% right to clear the left box
            centerX = width * 0.62;
            centerY = height * 0.5;
        }

        function initPlanets() {
            planets.length = 0;
            // ENLARGED: Max radius boosted from 0.45 to 0.62 for a massive display
            const maxRadius = Math.min(width, height) * 0.62;
            const minRadius = Math.min(width, height) * 0.16;
            for (let i = 0; i < orbitCount; i++) {
                const targetR = minRadius + ((maxRadius - minRadius) / orbitCount) * (i + 1);
                const startR = targetR + Math.max(width, height) * 1.2;
                planets.push({
                    orbitIndex: i,
                    targetRadius: targetR,
                    startRadius: startR,
                    currentRadius: startR,
                    angle: Math.random() * Math.PI * 2,
                    speed: (Math.random() * 0.0015 + 0.0008) * (i % 2 === 0 ? 1 : -1),
                    size: Math.random() * 8 + 6, // Slightly scaled up planet sizes
                    sides: Math.floor(Math.random() * 3) * 2 + 4,
                    colorSet: colors.planets[i % colors.planets.length],
                    rotation: Math.random() * Math.PI,
                    rotationSpeed: (Math.random() * 0.02 - 0.01)
                });
            }
        }

        function easeInOutQuart(x) {
            return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
        }

        function drawJewel(x, y, radius, sides, colorSet, rotation, scale) {
            const [light, mid, dark] = colorSet;
            const r = radius * scale;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI) / sides;
                ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = dark;
            ctx.fill();

            for (let i = 0; i < sides; i++) {
                const angle1 = (i * 2 * Math.PI) / sides;
                const angle2 = ((i + 1) * 2 * Math.PI) / sides;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(r * Math.cos(angle1), r * Math.sin(angle1));
                ctx.lineTo(r * Math.cos(angle2), r * Math.sin(angle2));
                ctx.closePath();
                const facetAngle = angle1 + (Math.PI / sides) + rotation;
                const normalizedAngle = (facetAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                if (normalizedAngle > Math.PI && normalizedAngle < Math.PI * 1.5) {
                    ctx.fillStyle = light;
                } else if (normalizedAngle >= Math.PI * 1.5 || normalizedAngle < Math.PI * 0.5) {
                    ctx.fillStyle = mid;
                } else {
                    ctx.fillStyle = dark;
                }
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI) / sides;
                ctx.lineTo(r * 0.4 * Math.cos(angle), r * 0.4 * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = light;
            ctx.fill();
            ctx.restore();
        }

        function drawSunburst(progress) {
            // ENLARGED: Core sun size scale slightly boosted
            const baseSize = Math.min(width, height) * 0.085;
            const size = baseSize + Math.sin(time * 0.05) * (baseSize * 0.04);
            const numRays = 16;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(time * 0.004);

            ctx.beginPath();
            ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
            const glow = ctx.createRadialGradient(0, 0, size * 0.5, 0, 0, size * 2);
            glow.addColorStop(0, `rgba(212, 175, 55, ${0.35 * progress})`);
            glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
            ctx.fillStyle = glow;
            ctx.fill();

            for (let i = 0; i < numRays; i++) {
                const angle = (i * 2 * Math.PI) / numRays;
                const isLong = i % 2 === 0;
                const rayLength = size * (isLong ? 1.7 : 1.2);
                const rayWidth = size * (isLong ? 0.14 : 0.09);
                
                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, -rayWidth);
                ctx.lineTo(rayLength, 0);
                ctx.lineTo(0, rayWidth);
                ctx.closePath();
                const rayGrad = ctx.createLinearGradient(0, -rayWidth, 0, rayWidth);
                rayGrad.addColorStop(0, colors.core);
                rayGrad.addColorStop(0.5, colors.coreShadow);
                rayGrad.addColorStop(1, colors.bg);
                ctx.fillStyle = rayGrad;
                ctx.fill();
                ctx.restore();
            }

            ctx.rotate(-time * 0.008);
            drawJewel(0, 0, size * 0.75, 8, [colors.core, colors.coreShadow, '#8c7322'], 0, 1);
            ctx.restore();
        }

        function drawDecoOrbit(radius, progress, index) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.strokeStyle = `rgba(212, 175, 55, ${0.12 * progress})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, radius, radius * baseTilt, 0, 0, Math.PI * 2);
            ctx.stroke();

            if (progress > 0.8) {
                const nodeCount = (index + 1) * 4;
                ctx.fillStyle = `rgba(212, 175, 55, ${0.4 * progress})`;
                for(let i=0; i<nodeCount; i++) {
                    const angle = (i * Math.PI * 2) / nodeCount + (time * 0.001 * (index%2===0?1:-1));
                    const nx = Math.cos(angle) * radius;
                    const ny = Math.sin(angle) * radius * baseTilt;
                    ctx.save();
                    ctx.translate(nx, ny);
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-1.5, -1.5, 3, 3);
                    ctx.restore();
                }
            }
            ctx.restore();
        }

        function drawDecoBackground(progress) {
            if (progress < 0.1) return;
            ctx.strokeStyle = `rgba(212, 175, 55, ${0.02 * progress})`;
            ctx.lineWidth = 1;
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.beginPath();
            for(let i=0; i<36; i++) {
                const angle = (i * Math.PI * 2) / 36;
                ctx.moveTo(0,0);
                ctx.lineTo(Math.cos(angle)*width, Math.sin(angle)*width);
            }
            ctx.stroke();
            ctx.restore();
        }

        function animate(timestamp) {
            if (!collapseStartTime) collapseStartTime = timestamp;
            const elapsed = timestamp - collapseStartTime;
            
            let collapseProgress = 0;
            if (elapsed < COLLAPSE_DURATION) {
                const rawProgress = elapsed / COLLAPSE_DURATION;
                collapseProgress = easeInOutQuart(rawProgress);
            } else {
                isCollapsing = false;
                collapseProgress = 1;
            }

            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawDecoBackground(collapseProgress);

            const drawnOrbits = new Set();
            planets.forEach(p => {
                p.currentRadius = p.startRadius + (p.targetRadius - p.startRadius) * collapseProgress;
                if (!drawnOrbits.has(p.orbitIndex)) {
                    drawDecoOrbit(p.currentRadius, collapseProgress, p.orbitIndex);
                    drawnOrbits.add(p.orbitIndex);
                }
            });

            planets.sort((a, b) => {
                const yA = centerY + Math.sin(a.angle) * a.currentRadius * baseTilt;
                const yB = centerY + Math.sin(b.angle) * b.currentRadius * baseTilt;
                return yA - yB;
            });

            drawSunburst(collapseProgress);

            planets.forEach(p => {
                p.angle += p.speed;
                p.rotation += p.rotationSpeed;
                const x = centerX + Math.cos(p.angle) * p.currentRadius;
                const y = centerY + Math.sin(p.angle) * p.currentRadius * baseTilt;
                const depthFactor = (y - centerY) / (p.currentRadius * baseTilt);
                const scale = 1 + (depthFactor * 0.25);
                
                if (collapseProgress > 0.1) {
                    drawJewel(x, y, p.size, p.sides, p.colorSet, p.rotation, scale * Math.max(0.1, collapseProgress));
                }
            });

            time++;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initPlanets();
        });
        resize();
        initPlanets();
        requestAnimationFrame(animate);

        document.addEventListener('mousemove', (e) => {
            if (isCollapsing) return;
            const mouseX = e.clientX / width - 0.5;
            const mouseY = e.clientY / height - 0.5;
            // Keeps subtle interactive movement tethered around its new right-aligned center anchor
            centerX += ((width * 0.62) + (mouseX * 40) - centerX) * 0.05;
            centerY += ((height * 0.5) + (mouseY * 40) - centerY) * 0.05;
        });

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const hamburgerPanel = document.getElementById('hamburger-panel');

        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(hamburgerPanel.style.transform === 'translateX(0px)') {
                hamburgerPanel.style.transform = 'translateX(-100%)';
            } else {
                hamburgerPanel.style.transform = 'translateX(0px)';
            }
        });

        document.addEventListener('click', () => {
            hamburgerPanel.style.transform = 'translateX(-100%)';
        });
    </script>
</body>
</html>
