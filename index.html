<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Art Deco Solar System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://api.fontshare.com/v2/css?f[]=zodiak@300,400,700,900&f[]=bespoke-sans@300,400,500&display=swap');
        :root {
            --color-emerald-dark: #04140f;
            --color-emerald-base: #0a2e22;
            --color-gold-light: #fef1c7;
            --color-gold-base: #d4af37;
            --color-gold-dark: #8c7322;
            --font-serif: 'Zodiak', serif;
            --font-sans: 'Bespoke Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-emerald-dark);
            color: var(--color-gold-light);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .font-serif {
            font-family: var(--font-serif);
        }

        .noise-texture {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #fef1c7 0%, #d4af37 50%, #8c7322 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-gold {
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(254, 241, 199, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-gold:hover::before {
            left: 100%;
        }

        #hamburger-panel {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
    </style>
</head>
<body>
    <div class="relative w-screen h-screen overflow-hidden bg-[#04140f]" style="isolation: isolate;">
        
        <canvas id="solar-system" class="absolute inset-0 w-full h-full" style="z-index: 0;"></canvas>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,var(--color-emerald-dark)_100%)] opacity-80 pointer-events-none" style="z-index: 1;"></div>
        <div class="noise-texture" style="z-index: 2;"></div>

        <div class="absolute inset-6 border border-[#d4af37]/30 pointer-events-none" style="z-index: 3;">
            <div class="absolute -top-[1px] -left-[1px] w-8 h-8 border-t-2 border-l-2 border-[#d4af37]"></div>
            <div class="absolute -top-[1px] -right-[1px] w-8 h-8 border-t-2 border-r-2 border-[#d4af37]"></div>
            <div class="absolute -bottom-[1px] -left-[1px] w-8 h-8 border-b-2 border-l-2 border-[#d4af37]"></div>
            <div class="absolute -bottom-[1px] -right-[1px] w-8 h-8 border-b-2 border-r-2 border-[#d4af37]"></div>
        </div>


        <div class="absolute inset-0 flex flex-col justify-between p-12 pointer-events-none" style="z-index: 50;">
            
            <div class="w-full flex items-center justify-between">
                <button id="hamburger-btn" class="pointer-events-auto flex flex-col justify-between w-9 h-7 bg-[#d4af37]/50 hover:bg-[#d4af37]/70 p-1.5 rounded border border-[#d4af37] items-center justify-center transition-all duration-300 shadow-md">
                    <div class="w-5 h-3.5 flex flex-col justify-between group pointer-events-none">
                        <span class="w-full h-[2px] bg-[#04140f] transition-all duration-300 origin-left group-[.active]:rotate-45 group-[.active]:translate-y-[1px]"></span>
                        <span class="w-2/3 h-[2px] bg-[#04140f] transition-all duration-300 group-[.active]:opacity-0"></span>
                        <span class="w-full h-[2px] bg-[#04140f] transition-all duration-300 origin-left group-[.active]:-rotate-45 group-[.active]:-translate-y-[1px]"></span>
                    </div>
                </button>

                <div class="flex items-center gap-4 pl-4">
                    <div class="w-8 h-8 border border-[#d4af37] rotate-45 flex items-center justify-center">
                        <div class="w-4 h-4 border border-[#d4af37]/60 flex items-center justify-center">
                            <div class="w-1 h-1 bg-[#d4af37]"></div>
                        </div>
                    </div>
                    <a href="#" class="font-serif text-xl tracking-widest uppercase text-[#fef1c7]">Aetheria</a>
                </div>

                <button id="nav-inquire" class="hidden sm:flex items-center gap-2 border border-[#d4af37] bg-[#d4af37]/50 px-5 py-1.5 text-xs tracking-[0.15em] uppercase hover:bg-[#d4af37]/70 transition-all duration-500 backdrop-blur-sm pointer-events-auto">
                    Inquire
                    <iconify-icon icon="lucide:arrow-up-right" class="text-[#fef1c7]"></iconify-icon>
                </button>
            </div>

            <div class="w-full flex-1 flex items-center justify-between my-4">
                <a href="next-page.html" class="pointer-events-auto flex flex-col items-center justify-center w-32 h-52 rounded-2xl border border-[#d4af37] bg-[#d4af37]/50 hover:bg-[#d4af37]/70 transition-all duration-500 group backdrop-blur-sm shadow-[0_0_20px_rgba(4,20,15,0.6)] text-center">
                    <iconify-icon icon="lucide:cpu" class="text-2xl text-[#fef1c7] mb-3 group-hover:scale-110 transition-transform duration-500"></iconify-icon>
                    <span class="text-xs font-semibold tracking-[0.2em] uppercase text-[#fef1c7] px-2">Ai agent</span>
                </a>

                <main class="text-center max-w-lg mx-auto pointer-events-auto">
                    <div class="flex items-center justify-center gap-3 mb-4">
                        <div class="h-[1px] w-8 bg-[#d4af37]/40"></div>
                        <span class="text-[10px] tracking-[0.3em] uppercase text-[#d4af37]">The Zenith of Mechanics</span>
                        <div class="h-[1px] w-8 bg-[#d4af37]/40"></div>
                    </div>
                    
                    <h1 class="font-serif text-4xl md:text-6xl lg:text-7xl leading-none tracking-tight mb-6">
                        <span class="block text-gold-gradient font-bold">ORRERY</span>
                        <span class="block text-2xl md:text-4xl font-light italic mt-1 text-[#fef1c7]/90">Magnifica</span>
                    </h1>
                    
                    <p class="text-xs md:text-sm leading-relaxed text-[#fef1c7]/70 font-light mb-8 max-w-xs mx-auto">
                        A masterwork of horological precision and cosmic artistry.
                    </p>

                    <a href="#" class="btn-gold inline-flex items-center justify-center gap-3 bg-[#d4af37] text-[#04140f] px-6 py-3.5 uppercase text-[10px] tracking-[0.2em] font-medium hover:bg-[#fef1c7] shadow-[0_0_30px_rgba(212,175,55,0.2)]">
                        Commence Journey
                        <div class="w-1 h-1 bg-[#04140f] rotate-45"></div>
                    </a>
                </main>

                <div class="w-32 invisible"></div>
            </div>

            <div class="w-full flex items-end justify-between">
                <button class="pointer-events-auto border border-[#d4af37] bg-[#d4af37]/50 hover:bg-[#d4af37]/70 px-6 py-2 rounded text-xs font-semibold tracking-[0.15em] uppercase text-[#fef1c7] transition-all duration-500 backdrop-blur-sm shadow-[0_0_20px_rgba(4,20,15,0.6)]">
                    About
                </button>

                <div class="flex flex-col items-center gap-2 mb-2">
                    <div class="h-8 w-[1px] bg-gradient-to-b from-transparent to-[#d4af37]/50"></div>
                    <div class="w-1.5 h-1.5 border border-[#d4af37] rotate-45"></div>
                </div>

                <div class="text-[10px] tracking-widest uppercase text-[#fef1c7]/50 text-right">
                    <span>Est. 1927</span><br/>
                    <span class="text-[#d4af37]">Metropolis</span>
                </div>
            </div>

        </div>

        <div id="hamburger-panel" class="fixed top-0 left-0 h-full w-80 bg-[#04140f]/95 border-r border-[#d4af37]/40 -translate-x-full flex flex-col justify-center p-12 gap-6 pointer-events-auto backdrop-blur-md" style="z-index: 100;">
            <div class="absolute top-24 left-12 h-[1px] w-12 bg-[#d4af37]/40"></div>
            <a href="#" class="font-serif text-2xl tracking-widest text-[#fef1c7] hover:text-[#d4af37] transition-colors duration-300 py-2">Home</a>
            <a href="#" class="font-serif text-2xl tracking-widest text-[#fef1c7] hover:text-[#d4af37] transition-colors duration-300 py-2">Ai agents</a>
            <a href="#" class="font-serif text-2xl tracking-widest text-[#fef1c7] hover:text-[#d4af37] transition-colors duration-300 py-2">About ai agent</a>
            <div class="w-2 h-2 border border-[#d4af37] rotate-45 mt-4"></div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('solar-system');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height, centerX, centerY;
        let time = 0;
        let isCollapsing = true;
        let collapseStartTime = null;
        const COLLAPSE_DURATION = 3500;

        const colors = {
            bg: '#04140f',
            core: '#fef1c7',
            coreShadow: '#d4af37',
            orbitLine: 'rgba(212, 175, 55, 0.25)',
            orbitDecor: 'rgba(212, 175, 55, 0.6)',
            planets: [
                ['#fef1c7', '#d4af37', '#8c7322'],
                ['#6ee7b7', '#10b981', '#047857'],
                ['#fca5a5', '#ef4444', '#b91c1c'],
                ['#e9d5ff', '#a855f7', '#6b21a8'],
                ['#bfdbfe', '#3b82f6', '#1d4ed8'],
                ['#fef08a', '#eab308', '#a16207']
            ]
        };
        const orbitCount = 6;
        const baseTilt = 0.4;
        const planets = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            centerX = width / 2;
            centerY = height / 2;
        }

        function initPlanets() {
            planets.length = 0;
            const maxRadius = Math.min(width, height) * 0.9;
            const minRadius = Math.min(width, height) * 0.15;
            for (let i = 0; i < orbitCount; i++) {
                const targetR = minRadius + ((maxRadius - minRadius) / orbitCount) * (i + 1);
                const startR = targetR + Math.max(width, height) * 1.5;
                planets.push({
                    orbitIndex: i,
                    targetRadius: targetR,
                    startRadius: startR,
                    currentRadius: startR,
                    angle: Math.random() * Math.PI * 2,
                    speed: (Math.random() * 0.002 + 0.001) * (i % 2 === 0 ? 1 : -1),
                    size: Math.random() * 8 + 6,
                    sides: Math.floor(Math.random() * 3) * 2 + 4,
                    colorSet: colors.planets[i % colors.planets.length],
                    rotation: Math.random() * Math.PI,
                    rotationSpeed: (Math.random() * 0.02 - 0.01)
                });
            }
        }

        function easeInOutQuart(x) {
            return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
        }

        function drawJewel(x, y, radius, sides, colorSet, rotation, scale) {
            const [light, mid, dark] = colorSet;
            const r = radius * scale;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI) / sides;
                ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = dark;
            ctx.fill();

            for (let i = 0; i < sides; i++) {
                const angle1 = (i * 2 * Math.PI) / sides;
                const angle2 = ((i + 1) * 2 * Math.PI) / sides;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(r * Math.cos(angle1), r * Math.sin(angle1));
                ctx.lineTo(r * Math.cos(angle2), r * Math.sin(angle2));
                ctx.closePath();
                const facetAngle = angle1 + (Math.PI / sides) + rotation;
                const normalizedAngle = (facetAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                if (normalizedAngle > Math.PI && normalizedAngle < Math.PI * 1.5) {
                    ctx.fillStyle = light;
                } else if (normalizedAngle >= Math.PI * 1.5 || normalizedAngle < Math.PI * 0.5) {
                    ctx.fillStyle = mid;
                } else {
                    ctx.fillStyle = dark;
                }
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI) / sides;
                ctx.lineTo(r * 0.4 * Math.cos(angle), r * 0.4 * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = light;
            ctx.fill();
            ctx.restore();
        }

        function drawSunburst(progress) {
            const baseSize = Math.min(width, height) * 0.08;
            const size = baseSize + Math.sin(time * 0.05) * (baseSize * 0.05);
            const numRays = 16;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(time * 0.005);

            ctx.beginPath();
            ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
            const glow = ctx.createRadialGradient(0, 0, size * 0.5, 0, 0, size * 2);
            glow.addColorStop(0, `rgba(212, 175, 55, ${0.4 * progress})`);
            glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
            ctx.fillStyle = glow;
            ctx.fill();

            for (let i = 0; i < numRays; i++) {
                const angle = (i * 2 * Math.PI) / numRays;
                const isLong = i % 2 === 0;
                const rayLength = size * (isLong ? 1.8 : 1.3);
                const rayWidth = size * (isLong ? 0.15 : 0.1);
                
                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, -rayWidth);
                ctx.lineTo(rayLength, 0);
                ctx.lineTo(0, rayWidth);
                ctx.closePath();
                const rayGrad = ctx.createLinearGradient(0, -rayWidth, 0, rayWidth);
                rayGrad.addColorStop(0, colors.core);
                rayGrad.addColorStop(0.5, colors.coreShadow);
                rayGrad.addColorStop(1, colors.bg);
                ctx.fillStyle = rayGrad;
                ctx.fill();
                ctx.restore();
            }

            ctx.rotate(-time * 0.01);
            drawJewel(0, 0, size * 0.8, 8, [colors.core, colors.coreShadow, '#8c7322'], 0, 1);
            ctx.restore();
        }

        function drawDecoOrbit(radius, progress, index) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 * progress})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, radius, radius * baseTilt, 0, 0, Math.PI * 2);
            ctx.stroke();

            if (progress > 0.8) {
                const nodeCount = (index + 1) * 4;
                ctx.fillStyle = `rgba(212, 175, 55, ${0.5 * progress})`;
                for(let i=0; i<nodeCount; i++) {
                    const angle = (i * Math.PI * 2) / nodeCount + (time * 0.001 * (index%2===0?1:-1));
                    const nx = Math.cos(angle) * radius;
                    const ny = Math.sin(angle) * radius * baseTilt;
                    ctx.save();
                    ctx.translate(nx, ny);
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-2, -2, 4, 4);
                    ctx.restore();
                }
            }
            ctx.restore();
        }

        function drawDecoBackground(progress) {
            if (progress < 0.1) return;
            ctx.strokeStyle = `rgba(212, 175, 55, ${0.03 * progress})`;
            ctx.lineWidth = 1;
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.beginPath();
            for(let i=0; i<36; i++) {
                const angle = (i * Math.PI * 2) / 36;
                ctx.moveTo(0,0);
                ctx.lineTo(Math.cos(angle)*width, Math.sin(angle)*width);
            }
            ctx.stroke();
            ctx.restore();
        }

        function animate(timestamp) {
            if (!collapseStartTime) collapseStartTime = timestamp;
            const elapsed = timestamp - collapseStartTime;
            
            let collapseProgress = 0;
            if (elapsed < COLLAPSE_DURATION) {
                const rawProgress = elapsed / COLLAPSE_DURATION;
                collapseProgress = easeInOutQuart(rawProgress);
            } else {
                isCollapsing = false;
                collapseProgress = 1;
            }

            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawDecoBackground(collapseProgress);

            const drawnOrbits = new Set();
            planets.forEach(p => {
                p.currentRadius = p.startRadius + (p.targetRadius - p.startRadius) * collapseProgress;
                if (!drawnOrbits.has(p.orbitIndex)) {
                    drawDecoOrbit(p.currentRadius, collapseProgress, p.orbitIndex);
                    drawnOrbits.add(p.orbitIndex);
                }
            });

            planets.sort((a, b) => {
                const yA = centerY + Math.sin(a.angle) * a.currentRadius * baseTilt;
                const yB = centerY + Math.sin(b.angle) * b.currentRadius * baseTilt;
                return yA - yB;
            });

            drawSunburst(collapseProgress);

            planets.forEach(p => {
                p.angle += p.speed;
                p.rotation += p.rotationSpeed;
                const x = centerX + Math.cos(p.angle) * p.currentRadius;
                const y = centerY + Math.sin(p.angle) * p.currentRadius * baseTilt;
                const depthFactor = (y - centerY) / (p.currentRadius * baseTilt);
                const scale = 1 + (depthFactor * 0.3);
                
                if (collapseProgress > 0.1) {
                    drawJewel(x, y, p.size, p.sides, p.colorSet, p.rotation, scale * Math.max(0.1, collapseProgress));
                }
            });

            time++;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initPlanets();
        });
        resize();
        initPlanets();
        requestAnimationFrame(animate);

        document.addEventListener('mousemove', (e) => {
            if (isCollapsing) return;
            const mouseX = e.clientX / width - 0.5;
            const mouseY = e.clientY / height - 0.5;
            centerX += ((width / 2) + (mouseX * 40) - centerX) * 0.05;
            centerY += ((height / 2) + (mouseY * 40) - centerY) * 0.05;
        });

        // Trigger drawer panel slideout action logic
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const hamburgerPanel = document.getElementById('hamburger-panel');

        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('active');
            if(hamburgerBtn.classList.contains('active')) {
                hamburgerPanel.style.transform = 'translateX(0)';
            } else {
                hamburgerPanel.style.transform = 'translateX(-100%)';
            }
        });
    </script>
</body>
