<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Art Deco Solar System</title>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://api.fontshare.com/v2/css?f[]=zodiak@300,400,700,900&f[]=bespoke-sans@300,400,500&display=swap');
        
        :root {
            --color-emerald-dark: #04140f;
            --color-emerald-base: #0a2e22;
            --color-gold-light: #fef1c7;
            --color-gold-base: #d4af37;
            --color-gold-dark: #8c7322;
            --font-serif: 'Zodiak', serif;
            --font-sans: 'Bespoke Sans', sans-serif;
        }

        /* Pure CSS resets and strict layout rules */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-emerald-dark);
            color: var(--color-gold-light);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        /* Complete Viewport Layout Grid Control */
        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .radial-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--color-emerald-dark) 100%);
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        /* Decorative Frame Border Lines */
        .deco-frame {
            position: absolute;
            inset: 24px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 3;
        }
        .corner-ornament {
            position: absolute;
            width: 32px;
            height: 32px;
        }
        .top-left { top: -1px; left: -1px; border-top: 2px solid var(--color-gold-base); border-l: 2px solid var(--color-gold-base); }
        .top-right { top: -1px; right: -1px; border-top: 2px solid var(--color-gold-base); border-r: 2px solid var(--color-gold-base); }
        .bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid var(--color-gold-base); border-l: 2px solid var(--color-gold-base); }
        .bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid var(--color-gold-base); border-r: 2px solid var(--color-gold-base); }

        /* Foreground Interface Stacking Alignment system */
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            pointer-events: none;
            z-index: 50;
        }

        /* Header Layout */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .brand-space {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-diamond {
            width: 32px;
            height: 32px;
            border: 1px solid var(--color-gold-base);
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-dot {
            width: 4px;
            height: 4px;
            background-color: var(--color-gold-base);
        }
        .logo-text {
            font-family: var(--font-serif);
            font-size: 20px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--color-gold-light);
        }

        /* MIDDLE VIEWPORT MAIN ROW */
        .middle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex: 1;
            margin: 16px 0;
        }

        /* EXACT MATCH: Your Glowing Purple AI Agent Card Specification */
        .ai-agent-portal-card {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 144px;
            height: 224px;
            border-radius: 24px;
            text-decoration: none;
            background: rgba(10, 46, 34, 0.25);
            border: 2px solid rgba(168, 85, 247, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
        }

        .ai-agent-portal-card:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: #f5f3ff;
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.9), 0 0 60px rgba(168, 85, 247, 0.5);
        }

        .shiny-purple-text {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1.3;
            margin-top: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 40%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 10px rgba(168, 85, 247, 0.6));
        }

        /* Center Content Copy */
        .hero-center-panel {
            text-align: center;
            max-w: 500px;
            margin: 0 auto;
            pointer-events: auto;
        }
        .subtitle-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .line-marker { width: 32px; height: 1px; background-color: rgba(212, 175, 55, 0.4); }
        .subtitle-text { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--color-gold-base); }
        
        .main-heading {
            font-family: var(--font-serif);
            font-size: 56px;
            line-height: 1;
            margin: 0 0 24px 0;
            letter-spacing: -0.02em;
        }
        .gold-gradient-title {
            background: linear-gradient(135deg, #fef1c7 0%, #d4af37 50%, #8c7322 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        .sub-italic-title {
            display: block;
            font-size: 32px;
            font-weight: 300;
            color: rgba(254, 241, 199, 0.9);
            font-style: italic;
            margin-top: 4px;
        }
        .hero-desc { font-size: 13px; font-weight: 300; line-height: 1.6; color: rgba(254, 241, 199, 0.7); max-w: 320px; margin: 0 auto 32px auto; }
        
        .btn-commence {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--color-gold-base);
            color: var(--color-emerald-dark);
            padding: 14px 28px;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.2em;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }
        .btn-commence:hover { background-color: var(--color-gold-light); }
        .square-dot { width: 4px; height: 4px; background-color: var(--color-emerald-dark); transform: rotate(45deg); }

        /* Mirror Layout Balance Spacer */
        .symmetry-spacer { width: 144px; visibility: hidden; }

        /* BOTTOM VIEWPORT ROW */
        .bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            width: 100%;
        }
        .btn-about {
            pointer-events: auto;
            border: 1px solid var(--color-gold-base);
            background: rgba(212, 175, 55, 0.5);
            color: var(--color-gold-light);
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-about:hover { background: rgba(212, 175, 55, 0.7); }

        .footer-center-mark { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 8px; }
        .vertical-accent-line { width: 1px; height: 32px; background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.5)); }
        .footer-diamond { width: 6px; height: 6px; border: 1px solid var(--color-gold-base); transform: rotate(45deg); }
        .footer-info { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(254, 241, 199, 0.5); text-align: right; line-height: 1.5; }

        /* Hamburger Control Structure */
        .btn-hamburger {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 36px;
            height: 28px;
            background: rgba(212, 175, 55, 0.5);
            border: 1px solid var(--color-gold-base);
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .bar { width: 100%; height: 2px; background-color: var(--color-emerald-dark); transition: all 0.3s; }

        #hamburger-panel {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 320px;
            background: rgba(4, 20, 15, 0.95);
            border-right: 1px solid rgba(212, 175, 55, 0.4);
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px;
            gap: 24px;
            box-sizing: border-box;
            z-index: 100;
        }
        .panel-link {
            font-family: var(--font-serif);
            font-size: 24px;
            letter-spacing: 0.1em;
            color: var(--color-gold-light);
            text-decoration: none;
            transition: color 0.3s;
        }
        .panel-link:hover { color: var(--color-gold-base); }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <canvas id="solar-system"></canvas>
        <div class="radial-overlay"></div>
        <div class="noise-texture"></div>
        <div class="deco-frame">
            <div class="corner-ornament top-left"></div>
            <div class="corner-ornament top-right"></div>
            <div class="corner-ornament bottom-left"></div>
            <div class="corner-ornament bottom-right"></div>
        </div>

        <div class="ui-layer">
            
            <div class="top-row">
                <div id="hamburger-btn" class="btn-hamburger">
                    <div class="bar"></div>
                    <div class="bar" style="width: 70%;"></div>
                    <div class="bar"></div>
                </div>

                <div class="brand-space">
                    <div class="logo-diamond"><div class="logo-dot"></div></div>
                    <a href="#" class="logo-text">Aetheria</a>
                </div>

                <div style="width: 36px; visibility: hidden;"></div>
            </div>

            <div class="middle-row">
                <a href="next-page.html" class="ai-agent-portal-card">
                    <iconify-icon icon="lucide:cpu" style="font-size: 28px; color: #c084fc;"></iconify-icon>
                    <span class="shiny-purple-text">Ai<br>agent</span>
                </a>

                <main class="hero-center-panel">
                    <div class="subtitle-badge">
                        <div class="line-marker"></div>
                        <span class="subtitle-text">The Zenith of Mechanics</span>
                        <div class="line-marker"></div>
                    </div>
                    
                    <h1 class="main-heading">
                        <span class="gold-gradient-title">ORRERY</span>
                        <span class="sub-italic-title">Magnifica</span>
                    </h1>
                    
                    <p class="hero-desc">A masterwork of horological precision and cosmic artistry.</p>

                    <a href="#" class="btn-commence">
                        Commence Journey
                        <div class="square-dot"></div>
                    </a>
                </main>

                <div class="symmetry-spacer"></div>
            </div>

            <div class="bottom-row">
                <button class="btn-about">About</button>

                <div class="footer-center-mark">
                    <div class="vertical-accent-line"></div>
                    <div class="footer-diamond"></div>
                </div>

                <div class="footer-info">
                    <span>Est. 1927</span><br/>
                    <span style="color: var(--color-gold-base);">Metropolis</span>
                </div>
            </div>

        </div>

        <div id="hamburger-panel">
            <a href="#" class="panel-link">Home</a>
            <a href="#" class="panel-link">Ai agents</a>
            <a href="#" class="panel-link">About ai agent</a>
        </div>

    </div>

    <script>

        let width, height, centerX, centerY;
        let time = 0;
        let isCollapsing = true;
        let collapseStartTime = null;
        const COLLAPSE_DURATION = 3500;

        const colors = {
            bg: '#04140f',
            core: '#fef1c7',
            coreShadow: '#d4af37',
            orbitLine: 'rgba(212, 175, 55, 0.25)',
